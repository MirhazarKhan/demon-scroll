<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#C4C4C4" />
  <title>Demon Scroll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      background: #C4C4C4;
      color: #111;
    }
    #reel {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #C4C4C4;
    }
    canvas#stage {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <section id="reel" aria-label="Demon scroll reel">
    <canvas id="stage" width="540" height="280"></canvas>
  </section>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="data/frames-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
